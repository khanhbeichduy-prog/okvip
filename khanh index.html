<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CASINO VIP DEMO</title>

<style>

/* ===== RESET ===== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial;

    background:
    radial-gradient(circle at top,
    #1e293b,
    #020617 70%);

    color:white;

    overflow-x:hidden;
}

/* ===== LOGIN ===== */

.auth-box{

    width:360px;

    margin:60px auto;

    background:
    linear-gradient(180deg,
    #1e293b,
    #0f172a);

    border:3px solid gold;

    border-radius:25px;

    padding:30px;

    text-align:center;

    box-shadow:
    0 0 35px rgba(0,0,0,0.7);
}

.auth-box h1{

    color:gold;

    margin-bottom:25px;
}

.auth-box input{

    width:100%;

    padding:15px;

    margin:10px 0;

    border:none;

    border-radius:12px;

    background:#334155;

    color:white;

    font-size:18px;
}

.auth-box button{

    width:100%;

    padding:15px;

    margin-top:15px;

    border:none;

    border-radius:12px;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(180deg,
    #ffd700,
    #b8860b);

    color:black;
}

.auth-result{

    margin-top:20px;

    font-size:18px;
}

/* ===== HEADER ===== */

header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px;

    background:
    linear-gradient(90deg,
    #111827,
    #1e293b);

    border-bottom:3px solid gold;
}

.logo{

    font-size:32px;

    color:gold;

    font-weight:bold;
}

.balance{

    font-size:22px;

    color:#facc15;
}

/* ===== WALLET ===== */

.wallet{

    width:350px;

    margin:20px auto;

    background:#0f172a;

    border:2px solid gold;

    border-radius:20px;

    padding:20px;

    text-align:center;
}

.wallet h2{

    color:gold;

    margin-bottom:20px;
}

.wallet input{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#334155;

    color:white;

    font-size:18px;
}

.wallet button{

    padding:14px 20px;

    margin-top:15px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:18px;

    font-weight:bold;

    background:
    linear-gradient(180deg,
    #ffd700,
    #b8860b);

    color:black;
}

.wallet-history{

    margin-top:20px;

    max-height:180px;

    overflow:auto;

    text-align:left;
}

.history-item{

    background:#1e293b;

    padding:10px;

    border-radius:10px;

    margin-top:10px;
}

/* ===== GAME ===== */

.game{

    max-width:550px;

    margin:30px auto;

    background:
    linear-gradient(180deg,
    #1e293b,
    #0f172a);

    border-radius:30px;

    border:3px solid gold;

    padding:30px;
}

/* ===== JACKPOT ===== */

.jackpot{

    text-align:center;

    font-size:32px;

    color:#facc15;

    margin-bottom:25px;

    animation:blink 1s infinite;
}

@keyframes blink{

    50%{
        opacity:0.6;
    }
}

/* ===== TABLE ===== */

.table{

    position:relative;

    width:360px;
    height:360px;

    margin:auto;

    border-radius:50%;

    background:
    radial-gradient(circle,
    #14532d,
    #052e16);

    border:10px solid #d4af37;
}

/* ===== DICE ===== */

.dice{

    position:absolute;

    width:100%;

    bottom:90px;

    text-align:center;

    font-size:70px;

    z-index:1;
}

/* ===== BOWL ===== */

.bowl{

    position:absolute;

    width:260px;
    height:260px;

    left:40px;
    top:30px;

    z-index:3;

    transition:0.5s;
}

.bowl-lid{

    width:100%;
    height:100%;

    border-radius:50%;

    background:
    radial-gradient(circle at 30% 30%,
    #8b5e34,
    #4a2c18 55%,
    #24140c);

    border:8px solid #d4af37;

    box-shadow:
    inset -25px -25px 35px rgba(0,0,0,0.5),
    inset 15px 15px 20px rgba(255,255,255,0.08),
    0 15px 25px rgba(0,0,0,0.8);
}

.handle{

    position:absolute;

    width:70px;
    height:70px;

    border-radius:50%;

    top:-25px;
    left:90px;

    background:
    radial-gradient(circle at 30% 30%,
    #ffd700,
    #a16207);

    border:5px solid #fff3b0;
}

/* ===== BUTTON ===== */

.buttons{

    text-align:center;

    margin-top:30px;
}

.buttons button{

    padding:15px 35px;

    margin:10px;

    border:none;

    border-radius:14px;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;
}

.tai{

    background:#22c55e;

    color:white;
}

.xiu{

    background:#ef4444;

    color:white;
}

.play{

    background:
    linear-gradient(180deg,
    #ffd700,
    #b8860b);

    color:black;
}

/* ===== RESULT ===== */

.result{

    margin-top:25px;

    text-align:center;

    font-size:30px;

    font-weight:bold;
}

/* ===== HISTORY ===== */

.history{

    margin-top:25px;

    text-align:center;
}

.history span{

    display:inline-block;

    padding:10px 14px;

    margin:5px;

    border-radius:10px;

    font-weight:bold;
}

.t{

    background:#22c55e;
}

.x{

    background:#ef4444;
}

/* ===== EFFECT ===== */

.shake{

    animation:shake 0.12s infinite;
}

@keyframes shake{

    0%{
        transform:
        translateX(-12px)
        rotate(-5deg);
    }

    50%{
        transform:
        translateX(12px)
        rotate(5deg);
    }

    100%{
        transform:
        translateX(-12px)
        rotate(-5deg);
    }
}

.open{

    transform:
    translateY(-150px)
    rotate(-10deg);
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="auth-box" id="authBox">

<h1>🎰 CASINO VIP</h1>

<input
type="text"
id="username"
placeholder="Tên tài khoản">

<input
type="password"
id="password"
placeholder="Mật khẩu">

<button onclick="register()">
ĐĂNG KÝ
</button>

<button onclick="login()">
ĐĂNG NHẬP
</button>

<div class="auth-result"
id="authResult">
</div>

</div>

<!-- GAME -->

<div id="casinoGame"
style="display:none;">

<header>

<div class="logo">
🎲 CASINO VIP
</div>

<div class="balance">
💰 Xu:
<span id="money">
5000
</span>
</div>

</header>

<!-- WALLET -->

<div class="wallet">

<h2>💳 VÍ DEMO</h2>

<input
type="number"
id="amount"
placeholder="Nhập số xu">

<br>

<button onclick="depositDemo()">
NẠP XU
</button>

<button onclick="withdrawDemo()">
RÚT XU
</button>

<div class="wallet-history"
id="walletHistory">
</div>

</div>

<!-- GAME -->

<div class="game">

<div class="jackpot">
🔥 HŨ:
<span id="jackpot">
100000
</span> XU
</div>

<div class="table">

<div class="dice"
id="diceBox">
⚀ ⚄ ⚂
</div>

<div class="bowl"
id="bowl">

<div class="bowl-lid">

<div class="handle"></div>

</div>

</div>

</div>

<div class="buttons">

<button class="tai"
onclick="choose('tai')">
TÀI
</button>

<button class="xiu"
onclick="choose('xiu')">
XỈU
</button>

</div>

<div class="buttons">

<button class="play"
onclick="playGame()">
LẮC BÁT
</button>

</div>

<div class="result"
id="result">
Chọn Tài hoặc Xỉu
</div>

<div class="history"
id="history">
</div>

</div>

</div>

<script>

/* ===== DATA ===== */

let money = 5000;

let jackpot = 100000;

let selected = "";

/* ===== REGISTER ===== */

function register(){

    let user =
    document
    .getElementById("username")
    .value;

    let pass =
    document
    .getElementById("password")
    .value;

    if(user === "" || pass === ""){

        authMessage(
        "❌ Nhập đầy đủ");

        return;
    }

    let accounts =
    JSON.parse(
    localStorage.getItem("accounts"))
    || [];

    let exists =
    accounts.find(acc =>
    acc.username === user);

    if(exists){

        authMessage(
        "⚠️ Tài khoản tồn tại");

        return;
    }

    accounts.push({

        username:user,

        password:pass,

        money:5000

    });

    localStorage.setItem(
    "accounts",
    JSON.stringify(accounts)
    );

    authMessage(
    "✅ Đăng ký thành công");
}

/* ===== LOGIN ===== */

function login(){

    let user =
    document
    .getElementById("username")
    .value;

    let pass =
    document
    .getElementById("password")
    .value;

    let accounts =
    JSON.parse(
    localStorage.getItem("accounts"))
    || [];

    let found =
    accounts.find(acc =>

        acc.username === user &&

        acc.password === pass
    );

    if(found){

        localStorage.setItem(
        "currentUser",
        JSON.stringify(found)
        );

        money = found.money;

        updateMoney();

        document
        .getElementById("authBox")
        .style.display = "none";

        document
        .getElementById("casinoGame")
        .style.display = "block";

    }else{

        authMessage(
        "❌ Sai tài khoản");
    }
}

/* ===== MESSAGE ===== */

function authMessage(text){

    document
    .getElementById("authResult")
    .innerHTML = text;
}

/* ===== AUTO LOGIN ===== */

window.onload = function(){

    let current =
    JSON.parse(
    localStorage.getItem(
    "currentUser"));

    if(current){

        money = current.money;

        updateMoney();

        document
        .getElementById("authBox")
        .style.display = "none";

        document
        .getElementById("casinoGame")
        .style.display = "block";
    }
}

/* ===== WALLET ===== */

function depositDemo(){

    let amount =
    parseInt(
    document
    .getElementById("amount")
    .value);

    if(!amount || amount <= 0){

        return;
    }

    money += amount;

    updateMoney();

    addWallet(
    `💰 Nạp ${amount} xu`);
}

function withdrawDemo(){

    let amount =
    parseInt(
    document
    .getElementById("amount")
    .value);

    if(!amount || amount <= 0){

        return;
    }

    if(amount > money){

        return;
    }

    money -= amount;

    updateMoney();

    addWallet(
    `📤 Rút ${amount} xu`);
}

function addWallet(text){

    let box =
    document
    .getElementById("walletHistory");

    let div =
    document
    .createElement("div");

    div.className =
    "history-item";

    div.innerHTML =
    text;

    box.prepend(div);
}

/* ===== CHOOSE ===== */

function choose(type){

    selected = type;

    if(type === "tai"){

        document
        .getElementById("result")
        .innerHTML =
        "🔥 Đã chọn TÀI";

    }else{

        document
        .getElementById("result")
        .innerHTML =
        "❄️ Đã chọn XỈU";
    }
}

/* ===== PLAY ===== */

function playGame(){

    if(selected === ""){

        alert("Chọn Tài/Xỉu");

        return;
    }

    if(money < 100){

        alert("Không đủ xu");

        return;
    }

    money -= 100;

    jackpot += 100;

    updateMoney();

    const bowl =
    document
    .getElementById("bowl");

    const dice =
    document
    .getElementById("diceBox");

    const result =
    document
    .getElementById("result");

    bowl.classList.remove("open");

    bowl.classList.add("shake");

    dice.style.opacity = "0";

    result.innerHTML =
    "🎲 Đang lắc...";

    setTimeout(()=>{

        bowl.classList.remove("shake");

        bowl.classList.add("open");

        const faces = [
            "⚀","⚁","⚂",
            "⚃","⚄","⚅"
        ];

        let d1 =
        Math.floor(Math.random()*6);

        let d2 =
        Math.floor(Math.random()*6);

        let d3 =
        Math.floor(Math.random()*6);

        dice.innerHTML =
        `${faces[d1]}
         ${faces[d2]}
         ${faces[d3]}`;

        dice.style.opacity = "1";

        let total =
        (d1+1)+(d2+1)+(d3+1);

        let finalResult =
        total >= 11
        ? "tai"
        : "xiu";

        addHistory(finalResult);

        // jackpot

        if(d1 === 5 &&
           d2 === 5 &&
           d3 === 5){

            money += jackpot;

            result.innerHTML =
            `💥 NỔ HŨ +${jackpot}`;

            jackpot = 100000;

        }

        else if(finalResult === selected){

            money += 250;

            result.innerHTML =
            `🎉 THẮNG (${total})`;

        }else{

            result.innerHTML =
            `😢 THUA (${total})`;
        }

        updateMoney();

    },2200);
}

/* ===== UPDATE ===== */

function updateMoney(){

    document
    .getElementById("money")
    .innerText = money;

    document
    .getElementById("jackpot")
    .innerText = jackpot;
}

/* ===== HISTORY ===== */

function addHistory(type){

    let history =
    document
    .getElementById("history");

    let span =
    document
    .createElement("span");

    if(type === "tai"){

        span.className = "t";

        span.innerText = "TÀI";

    }else{

        span.className = "x";

        span.innerText = "XỈU";
    }

    history.prepend(span);

    if(history.children.length > 15){

        history.removeChild(
        history.lastChild);
    }
}

</script>

</body>
</html>
